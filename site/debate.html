<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Debate da Band · transcrição e números</title>
<meta name="description" content="Transcrição do debate e palavras mais usadas por Lula e Flávio Bolsonaro.">
<meta property="og:title" content="Debate da Band · transcrição e números">
<meta property="og:description" content="Transcrição e palavras mais usadas por Lula e Flávio Bolsonaro.">
<meta property="og:image" content="https://apuracao-2026.brlabs.workers.dev/og.jpg?v=2">
<meta name="twitter:card" content="summary_large_image">
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,300..700;1,300..700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
body { overflow: auto; }
.wrap { position: relative; z-index: 2; max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
h1 { font-family: var(--num); font-weight: 400; font-size: calc(34px * var(--num-k)); letter-spacing: var(--title-ls); line-height: 1.05; margin: 6px 0 4px; }
.sub { color: var(--muted); font-size: 13px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
.card { background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow-sm); min-width: 0; }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.card h2 i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.big { font-family: var(--num); font-size: calc(44px * var(--num-k)); line-height: 1; color: var(--c); }
.big small { font-size: .45em; opacity: .65; margin-left: 4px; }
.meta { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-hi); margin-top: 10px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--c); transition: width .8s var(--ease); }
.terms { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.terms span { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--surface-hi); color: var(--text-2); }
.terms b { color: var(--c); font-weight: 600; }
.log { background: var(--panel-solid); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 6px 4px; }
.log h2 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 10px 14px 4px; }
.ln { display: grid; grid-template-columns: 46px 96px 1fr; gap: 10px; padding: 7px 14px; font-size: 14px; line-height: 1.4; border-top: 1px solid var(--line); }
.ln:first-of-type { border-top: 0; }
.ln time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.ln b { font-size: 12px; font-weight: 600; padding-top: 2px; color: var(--c); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
.stats div { padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-hi); }
.stats b { display: block; font-size: 18px; font-weight: 500; }
.stats span { font-size: 11px; color: var(--muted); }
.more { font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 1px dashed var(--line-strong); background: none; color: var(--link); cursor: pointer; }
.more:hover { color: var(--text); }
.empty { color: var(--muted); padding: 24px 14px; }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } .ln { grid-template-columns: 40px 1fr; } .ln b { grid-column: 2; padding: 0; } .ln span { grid-column: 2; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="pill homelink" href="index.html"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 2.5 4 6l3.5 3.5"/></svg><span>Início</span></a>
    <div class="pill" id="pill" data-s="live"><i></i><span>Ao vivo</span></div>
  </div>
  <div class="sub">Debate Band · 18/10/2026</div>
  <h1>O debate em números</h1>
  <div class="sub" id="upd">Transcrição automática (pode conter erros) · atualiza a cada ~30 s</div>
  <div class="cards" id="cards"></div>
  <div class="log"><h2>Transcrição</h2><div id="log"><div class="empty">Aguardando o debate…</div></div></div>
</div>
<script src="config.js"></script>
<script>
(() => {
const BASE = window.TRACKER_LIVE_BASE || 'data/';
const COLORS = [[/lula/i, '#ff4a5c', 'Lula'], [/fl[aá]vio|bolsonaro/i, '#4d8dff', 'Flávio Bolsonaro']];
const col = (w) => (COLORS.find(([re]) => re.test(w)) || [0, '#94a3b8'])[1];
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const expanded = new Set(); let last = null;
const mmss = (t) => `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
async function pull() {
  try {
    const r = await fetch(`${BASE}debate.json?t=${Math.floor(Date.now() / 15000)}`, { cache: 'no-store' });
    const d = await r.json(); last = d; draw(d);
  } catch (e) { /* sem dados ainda */ }
}
function draw(d) {
  {
    const cands = Object.entries(d.people).filter(([n]) => /lula|flavio|flávio|bolsonaro/i.test(n));
    document.getElementById('cards').innerHTML = cands.map(([n, p]) => {
      const all = Object.entries(p.terms).sort((a, b) => b[1] - a[1]).slice(0, 30), open = expanded.has(n);
      const terms = all.slice(0, open ? 30 : 10).map(([t, c]) => `<span>${esc(t)} <b>${c}</b></span>`).join('')
        + (all.length > 10 ? `<button class="more" data-n="${esc(n)}" type="button">${open ? 'Ver menos' : 'Ver mais'}</button>` : '');
      return `<div class="card" style="--c:${col(n)}"><h2><i></i>${esc(n)}</h2>
        <div class="big">${p.words.toLocaleString('pt-BR')}<small>palavras</small></div>
        <div class="stats"><div><b>${p.interrupts || 0}</b><span>cortes</span></div><div><b>${p.questions || 0}</b><span>perguntas</span></div></div>
        <div class="terms">${terms}</div></div>`;
    }).join('') || '';
    const log = document.getElementById('log');
    log.innerHTML = d.lines.slice(-120).reverse().map((l) => `<div class="ln" style="--c:${col(l.who)}"><time>${mmss(l.t)}</time><b>${esc(l.who)}</b><span>${esc(l.text)}</span></div>`).join('') || '<div class="empty">Aguardando o debate…</div>';
    const pill = document.getElementById('pill'); pill.dataset.s = d.final ? 'done' : 'live'; pill.querySelector('span').textContent = d.final ? 'Encerrado' : 'Ao vivo';
    document.getElementById('upd').textContent = `Transcrição automática (pode conter erros) · atualizado ${new Date(d.updated * 1000).toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo' }) + ' (Brasília)'}`;
  }
}
document.getElementById('cards').addEventListener('click', (e) => {
  const b = e.target.closest('button.more'); if (!b) return;
  expanded.has(b.dataset.n) ? expanded.delete(b.dataset.n) : expanded.add(b.dataset.n);
  if (last) draw(last);
});
pull(); setInterval(pull, 20000);
})();
</script>
</body>
</html>
